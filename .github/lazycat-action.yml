version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/jsoncrack.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: jsoncrack
    bump: patch

build:
  run_buildscript: false

images:
  # 主应用：上游仅 latest（mutable）+ 构建 hash 家族，用 latest + bump: patch（digest 比较）
  - id: jsoncrack
    target: service
    service: jsoncrack
    source: shokohsc/jsoncrack
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: JSON Crack
    summary: "开源 JSON 可视化编辑器"
